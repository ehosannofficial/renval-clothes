<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RENVAL CLOTHES</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:#080808;
  color:#fff;
  display:flex;
  justify-content:center;
}

.container{
  width:100%;
  max-width:520px;
  padding:38px 20px;
}

.brand{
  text-align:center;
  margin-bottom:30px;
}

.logo{
  width:78px;
  height:78px;
  border:1px solid #444;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
  font-size:25px;
  font-weight:bold;
}

.brand h1{
  margin-top:16px;
  letter-spacing:3px;
  font-size:23px;
}

.brand p{
  color:#888;
  margin-top:8px;
  font-size:13px;
}

.links{
  display:flex;
  flex-direction:column;
  gap:13px;
}

.link{
  width:100%;
  padding:16px;
  border:1px solid #292929;
  border-radius:13px;
  background:#111;
  color:#fff;
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:15px;
  transition:.2s;
}

.link:hover{
  background:#191919;
  transform:translateY(-2px);
}

.icon{
  width:40px;
  height:40px;
  border-radius:10px;
  background:#fff;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:17px;
  flex-shrink:0;
}

.link-title{
  font-size:15px;
  font-weight:600;
}

.admin-btn{
  margin-top:30px;
  width:100%;
  padding:13px;
  background:transparent;
  border:1px solid #333;
  color:#777;
  border-radius:10px;
  cursor:pointer;
}

#loginBox{
  display:none;
  margin-top:18px;
}

.admin{
  display:none;
  margin-top:25px;
  border-top:1px solid #292929;
  padding-top:25px;
}

.admin h2{
  margin-bottom:18px;
  font-size:19px;
}

input{
  width:100%;
  padding:13px;
  margin-bottom:10px;
  border-radius:8px;
  border:1px solid #333;
  background:#151515;
  color:#fff;
  outline:none;
}

.primary{
  width:100%;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#fff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

.panel{
  margin-top:25px;
}

.admin-item{
  background:#151515;
  border:1px solid #292929;
  border-radius:10px;
  padding:13px;
  margin-bottom:10px;
}

.admin-item strong{
  display:block;
  margin-bottom:5px;
}

.admin-item small{
  color:#777;
  word-break:break-all;
}

.actions{
  display:flex;
  gap:7px;
  margin-top:10px;
  flex-wrap:wrap;
}

.actions button{
  padding:8px 12px;
  border-radius:7px;
  border:1px solid #333;
  background:#222;
  color:#fff;
  cursor:pointer;
}

.logout{
  margin-top:15px;
  width:100%;
  padding:10px;
  border:1px solid #333;
  background:transparent;
  color:#aaa;
  border-radius:8px;
}

footer{
  text-align:center;
  color:#555;
  font-size:11px;
  margin-top:30px;
}
</style>
</head>

<body>

<div class="container">

<div class="brand">
  <div class="logo">R</div>
  <h1>RENVAL CLOTHES</h1>
  <p>Wear What's Next.</p>
</div>

<div id="links" class="links"></div>

<button class="admin-btn" onclick="showLogin()">
  Admin Panel
</button>

<div id="loginBox">

<input id="email"
type="email"
placeholder="Admin Email">

<input id="password"
type="password"
placeholder="Password">

<button class="primary" onclick="login()">
LOGIN
</button>

</div>

<div id="adminPanel" class="admin">

<h2>Link Management</h2>

<input id="title" placeholder="Link title">

<input id="url" placeholder="https://example.com">

<input id="icon" placeholder="Icon / Letter">

<button class="primary" onclick="addLink()">
+ ADD LINK
</button>

<div id="adminLinks" class="panel"></div>

<button class="logout" onclick="logout()">
LOG OUT
</button>

</div>

<footer>
© 2026 RENVAL CLOTHES
</footer>

</div>

<script>

const SUPABASE_URL =
"https://tiuqvzlahryvzohitvwz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ipuz7AGiv0LjsjcswK6YLw_DxjXJPiV";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function loadLinks(){

  const {data,error} =
    await supabaseClient
    .from("links")
    .select("*")
    .order("sort_order",{ascending:true});

  if(error){
    console.log(error);
    return;
  }

  const box =
    document.getElementById("links");

  box.innerHTML="";

  data.forEach(link=>{

    const a =
      document.createElement("a");

    a.className="link";
    a.href=link.url;
    a.target="_blank";
    a.rel="noopener noreferrer";

    a.innerHTML=`
      <div class="icon">
        ${escapeHtml(link.icon || "🔗")}
      </div>

      <div class="link-title">
        ${escapeHtml(link.title)}
      </div>
    `;

    box.appendChild(a);
  });
}

function showLogin(){

  const box =
    document.getElementById("loginBox");

  box.style.display =
    box.style.display==="block"
    ? "none"
    : "block";
}

async function login(){

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const {error} =
    await supabaseClient.auth
    .signInWithPassword({
      email,
      password
    });

  if(error){
    alert(error.message);
    return;
  }

  document.getElementById("loginBox")
    .style.display="none";

  document.getElementById("adminPanel")
    .style.display="block";

  loadAdminLinks();
}

async function checkSession(){

  const {data} =
    await supabaseClient.auth
    .getSession();

  if(data.session){

    document.getElementById("adminPanel")
      .style.display="block";

    loadAdminLinks();
  }
}

async function addLink(){

  const title =
    document.getElementById("title")
    .value.trim();

  const url =
    document.getElementById("url")
    .value.trim();

  const icon =
    document.getElementById("icon")
    .value.trim() || "🔗";

  if(!title || !url){
    alert("Title and URL required.");
    return;
  }

  const {data:existing} =
    await supabaseClient
    .from("links")
    .select("sort_order")
    .order("sort_order",{
      ascending:false
    })
    .limit(1);

  const nextOrder =
    existing && existing.length
    ? existing[0].sort_order + 1
    : 1;

  const {error} =
    await supabaseClient
    .from("links")
    .insert({
      title:title,
      url:url,
      icon:icon,
      sort_order:nextOrder
    });

  if(error){
    alert(error.message);
    return;
  }

  document.getElementById("title").value="";
  document.getElementById("url").value="";
  document.getElementById("icon").value="";

  loadLinks();
  loadAdminLinks();
}

async function loadAdminLinks(){

  const {data,error} =
    await supabaseClient
    .from("links")
    .select("*")
    .order("sort_order",{
      ascending:true
    });

  if(error) return;

  const box =
    document.getElementById("adminLinks");

  box.innerHTML="";

  data.forEach(link=>{

    const div =
      document.createElement("div");

    div.className="admin-item";

    div.innerHTML=`

      <strong>
        ${escapeHtml(link.icon || "🔗")}
        ${escapeHtml(link.title)}
      </strong>

      <small>
        ${escapeHtml(link.url)}
      </small>

      <div class="actions">

        <button onclick="editLink(${link.id})">
        Edit
        </button>

        <button onclick="moveUp(${link.id},${link.sort_order})">
        ↑
        </button>

        <button onclick="moveDown(${link.id},${link.sort_order})">
        ↓
        </button>

        <button onclick="deleteLink(${link.id})">
        Delete
        </button>

      </div>
    `;

    box.appendChild(div);
  });
}

async function editLink(id){

  const title =
    prompt("New title:");

  if(title===null) return;

  const url =
    prompt("New URL:");

  if(url===null) return;

  const icon =
    prompt("New icon:","🔗");

  const {error} =
    await supabaseClient
    .from("links")
    .update({
      title:title,
      url:url,
      icon:icon || "🔗"
    })
    .eq("id",id);

  if(error){
    alert(error.message);
    return;
  }

  loadLinks();
  loadAdminLinks();
}

async function deleteLink(id){

  if(!confirm("Delete this link?"))
    return;

  const {error} =
    await supabaseClient
    .from("links")
    .delete()
    .eq("id",id);

  if(error){
    alert(error.message);
    return;
  }

  loadLinks();
  loadAdminLinks();
}

async function moveUp(id,order){

  if(order<=1) return;

  const {data} =
    await supabaseClient
    .from("links")
    .select("id,sort_order")
    .eq("sort_order",order-1)
    .single();

  if(!data) return;

  await supabaseClient
    .from("links")
    .update({sort_order:order-1})
    .eq("id",id);

  await supabaseClient
    .from("links")
    .update({sort_order:order})
    .eq("id",data.id);

  loadLinks();
  loadAdminLinks();
}

async function moveDown(id,order){

  const {data} =
    await supabaseClient
    .from("links")
    .select("id,sort_order")
    .eq("sort_order",order+1)
    .single();

  if(!data) return;

  await supabaseClient
    .from("links")
    .update({sort_order:order+1})
    .eq("id",id);

  await supabaseClient
    .from("links")
    .update({sort_order:order})
    .eq("id",data.id);

  loadLinks();
  loadAdminLinks();
}

async function logout(){

  await supabaseClient.auth.signOut();

  document.getElementById("adminPanel")
    .style.display="none";
}

function escapeHtml(text){

  const div =
    document.createElement("div");

  div.textContent=text;

  return div.innerHTML;
}

loadLinks();
checkSession();

</script>

</body>
  </html>
